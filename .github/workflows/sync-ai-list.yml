name: Sync AI.list

on:
  schedule:
    # 02:17 UTC, 10:17 CST
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-ai-list
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild AI.list from RuleGo
        run: python3 scripts/sync_ai_list.py

      - name: Commit and push
        run: |
          if git diff --quiet -- DivineEngine/AI.list; then
            echo "AI.list unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DivineEngine/AI.list
          git commit -m "Sync AI.list from RuleGo"
          git push
